{% extends "restaurant/base.html" %}

{% block content %}
<div class="container my-4">
    <h1>Create an account</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-success" type="submit">
            Create account
        </button>
    </form>

    <p class="mt-3">
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>.
    </p>
</div>
{% endblock %}
