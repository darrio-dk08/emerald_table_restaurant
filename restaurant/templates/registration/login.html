{% extends "restaurant/base.html" %}

{% block content %}
<div class="container my-4">
    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <input type="hidden" name="next" value="{{ next }}">

        <button class="btn btn-success" type="submit">
            Log in
        </button>
    </form>

    <p class="mt-3">
        Don't have an account?
        <a href="{% url 'signup' %}">Create an account</a>.
    </p>
</div>
{% endblock %}
